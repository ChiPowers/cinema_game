name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.4.3
        virtualenvs-create: true
        # In-project so the virtualenv can be cached by path below. Local
        # development uses a conda environment and is unaffected by this.
        virtualenvs-in-project: true

    - name: Restore cached virtualenv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

    # --only main,dev is explicit so that adding an optional group later cannot
    # silently start installing it in CI.
    - name: Install dependencies
      run: poetry install --only main,dev

    - name: Check formatting
      run: make format-check

    - name: Lint
      run: make lint

    - name: Run tests
      run: make test

    - name: Dependency declarations
      run: make deps-check

    - name: Import boundaries
      run: make import-boundaries

  # The build job runs with no extras, so it passes whether or not the
  # optional-dependency machinery works. These two build environments that
  # really do have exactly one backend, or none.
  extras:
    name: extra:${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ["anthropic", "openai", "vertex", "ollama"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.4.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install only this extra
      run: poetry install --only main --extras ${{ matrix.extra }}

    - name: Only this backend is usable
      run: poetry run python scripts/check_extras.py ${{ matrix.extra }}

  no-extras:
    name: no extras
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.4.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install with no extras
      run: poetry install --only main

    - name: No backend is usable
      run: poetry run python scripts/check_extras.py
