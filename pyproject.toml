[project]
name = "cinema_game_backend"
version = "2.3.4"
description = "Cinema Game — connect actors through shared movies"
authors = [
    { name = "Chivon Powers", email = "chivon.powers@gmail.com" },
    { name = "Reuben Brasher", email = "rkbrasher@gmail.com" },
]
license = "MIT"
readme = "README.md"
# Upper bound is required: Poetry cannot resolve dependencies that cap
# themselves at <4.0 against an unbounded range. Equivalent to the old
# Poetry-style `python = "^3.11"`.
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.135.2,<0.136.0",
    "uvicorn>=0.30.0,<0.31.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "langsmith>=0.8.18,<1.0.0",
    "rapidfuzz>=3.12.0,<4.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "art-graph",
    "reusable-llm-provider",
]

[tool.poetry]
packages = [{ include = "cinema_game_backend" }]

# Source enrichment only. These two are git dependencies, not on PyPI; the
# version constraint lives in [project.dependencies] above and the source here.
[tool.poetry.dependencies]
art-graph = { git = "https://github.com/newexo/artist-graph.git", tag = "v0.3.0" }
reusable-llm-provider = { git = "https://github.com/newexo/reusable-llm-provider.git", tag = "v0.5.1" }

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.6"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
coverage = "^7.12.0"
vulture = "^2.16"
deptry = "^0.25.1"

[tool.poetry.group.notebook.dependencies]
jupyter = "^1.1.1"
jupyterlab = "^4.4.8"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning",
    "ignore:Please use `import python_multipart`:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (includes E402 import placement, F401 unused
# imports). I: import sorting. UP: pyupgrade. ERA001: commented-out code.
# ARG is deliberately NOT enabled -- unused arguments are usually signature
# contracts in interface implementations, not dead code.
select = ["E", "F", "I", "UP", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_version.py" = ["F841"]
# A vulture baseline is a list of bare names, so every line is an undefined
# reference. See `make deadcode` for when this file exists. Vulture's
# generated comments (name plus source path and line number) routinely exceed
# the line-length limit and cannot be reflowed without breaking the format
# `--make-whitelist` produces, hence E501 as well as F821.
"deadcode-whitelist.py" = ["F821", "E501"]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/functional_tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.deptry]
# deptry's default DEP004 exclusion only matches a top-level `tests/`
# directory (see deptry.cli.DEFAULT_EXCLUDE); this project nests its tests at
# cinema_game_backend/tests/, so that exclusion never applies and the test
# suite's import of pytest is flagged even though it is correctly a dev
# dependency.
# cinema_game_backend/experiments_llm_harness.py is a dev-only LLM experiment
# tool invoked via scripts/run_llm_experiments.py, never by the deployed app,
# but it lives inside the package tree (same non-standard layout as above)
# rather than an excluded directory. It imports anthropic/httpx directly for
# experimentation, but this project names no vendor LLM package or version
# range of its own -- that lives solely in reusable-llm-provider, so those
# packages are deliberately NOT declared as dependencies here. The file is
# excluded from analysis instead of adding a vendor declaration.
# uvicorn is run as the container's ASGI server (see Dockerfile CMD), never
# imported in Python code, so deptry cannot see the usage.
extend_exclude = ["cinema_game_backend/experiments_llm_harness.py"]
[tool.deptry.per_rule_ignores]
DEP004 = ["pytest"]
DEP002 = ["uvicorn"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
